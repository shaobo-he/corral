name: Corral CI

on: [push, pull_request, workflow_dispatch]

env:
  SOLUTION: source/Corral.sln
  Z3URL: https://github.com/Z3Prover/z3/releases/download/z3-5.0.0/z3-5.0.0-x64-glibc-2.39.zip

jobs:
  job0:
    name: Corral CI
    # ubuntu-24.04 or newer: the Z3 5.0.0 Linux build needs glibc >= 2.38
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Checkout Corral
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools, build Corral
        run: |
          # Download a Z3 release
          wget ${Z3URL}
          unzip z3*.zip
          # Change directory to Corral root folder
          cd $GITHUB_WORKSPACE
          # Restore dotnet tools
          dotnet tool restore
          # Build Corral
          dotnet build -c ${{ matrix.configuration }} ${SOLUTION}
      - name: Test Corral
        run: |
          export PATH="$(find $PWD/z3* -name bin -type d):$PATH"
          cd $GITHUB_WORKSPACE
          export CONFIGURATION=${{ matrix.configuration }}
          (cd test/regression && perl check.pl)
